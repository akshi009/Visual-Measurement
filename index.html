<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VisualMeasure</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #f7f8fa;
            --white: #fff;
            --navy: #0b1523;
            --teal: #0d9488;
            --teal-lt: #f0fdfa;
            --blue: #2563eb;
            --text: #0f172a;
            --text2: #475569;
            --text3: #94a3b8;
            --border: #e2e8f0;
            --border2: #cbd5e1;
            --shadow: 0 1px 3px rgba(0, 0, 0, .07), 0 1px 2px rgba(0, 0, 0, .04);
            --shadow2: 0 4px 20px rgba(0, 0, 0, .10);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh
        }

        nav {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            height: 58px;
            display: flex;
            align-items: center;
            padding: 0 48px
        }

        .nav-logo {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 17px;
            letter-spacing: -.03em
        }

        main {
            max-width: 1080px;
            margin: 0 auto;
            padding: 36px 24px
        }

        .top-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 24px;
            margin-bottom: 40px;
            align-items: start;
        }

        .panel {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: var(--shadow);
            height: 400px;
            position: sticky;
            top: 80px;
        }

        .panel h2 {
            font-family: 'Sora', sans-serif;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -.02em;
            margin-bottom: 20px
        }

        .field {
            margin-bottom: 14px
        }

        .label {
            font-size: 11.5px;
            font-weight: 500;
            color: var(--text2);
            margin-bottom: 5px;
            display: block;
            letter-spacing: .01em
        }

        .input-wrap {
            position: relative
        }

        .input-icon {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text3);
            pointer-events: none
        }

        input,
        select {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13.5px;
            color: var(--text);
            background: var(--white);
            outline: none;
            transition: .15s
        }

        input:focus,
        select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .08)
        }

        .search-input {
            padding-left: 32px
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%2394a3b8' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 11px center;
            padding-right: 30px;
            cursor: pointer
        }

        .qty-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px
        }

        .gen-btn {
            width: 100%;
            padding: 11px;
            background: var(--text);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: 'Sora', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: .2s;
            margin-bottom: 12px;
            letter-spacing: .01em
        }

        .gen-btn:hover {
            background: #1e293b;
            transform: translateY(-1px);
            box-shadow: var(--shadow2)
        }

        .gen-btn:active {
            transform: none
        }

        .container-chooser {
            margin-bottom: 14px
        }

        .container-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px
        }

        .c-chip {
            font-size: 11px;
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            color: var(--text2);
            background: var(--white);
            transition: .15s;
            font-family: 'DM Sans', sans-serif
        }

        .c-chip:hover {
            border-color: var(--teal);
            color: var(--teal)
        }

        .c-chip.active {
            border-color: var(--teal);
            background: var(--teal-lt);
            color: var(--teal);
            font-weight: 500
        }

        /* ── VIZ PANEL ── */
        .viz-panel {
            background: var(--navy);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            min-height: 460px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow2)
        }

        #viz-canvas {
            width: 100%;
            flex: 1;
            display: block;
            cursor: default
        }

        /* placeholder */
        .placeholder-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: rgba(255, 255, 255, .3);
            pointer-events: none
        }

        .placeholder-state p {
            font-size: 13px
        }

        /* info strip at bottom */
        .viz-label {
            /* position: absolute; */
            /* bottom: 14px; */
            /* left: 50%; */
            /* transform: translateX(-50%); */
            background: rgba(11, 21, 35, .85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, .1);
            border-radius: 10px;
            padding: 10px 18px;
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            gap: 14px;
            align-items: center;
            min-width: 200px;
            white-space: nowrap;
        }

        .vlabel-tag {
            font-size: 8px;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .4);
            margin-bottom: 2px
        }

        .vlabel-val {
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #fff
        }

        .vlabel-div {
            background: rgba(255, 255, 255, .15);
            height: 28px
        }

        .vlabel-section:last-child {
            text-align: right
        }

        /* comparison + tips */
        .comp-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 18px
        }

        .comp-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            box-shadow: var(--shadow)
        }

        .comp-card-label {
            font-size: 10.5px;
            color: var(--text3);
            margin-bottom: 3px
        }

        .comp-card-val {
            font-family: 'Sora', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--text)
        }

        .comp-card-sub {
            font-size: 11px;
            color: var(--text2);
            margin-top: 1px
        }

        .tips-panel {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 18px;
            box-shadow: var(--shadow);
            margin-bottom: 44px
        }

        .tips-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .07em;
            text-transform: uppercase;
            color: var(--text3);
            margin-bottom: 10px
        }

        .tips-list {
            display: flex;
            flex-direction: column;
            gap: 7px
        }

        .tip-row {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            font-size: 13px;
            color: var(--text2)
        }

        .tip-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--teal);
            flex-shrink: 0;
            margin-top: 5px
        }

        .hidden {
            display: none !important
        }

        .toast {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%) translateY(60px);
            background: var(--text);
            color: #fff;
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: var(--shadow2);
            transition: .3s;
            z-index: 999;
            pointer-events: none
        }

        .toast.show {
            transform: translateX(-50%) translateY(0)
        }

        footer {
            background: var(--navy);
            color: #fff;
            margin-top: 72px;
            padding: 36px 48px;
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .footer-logo {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 3px
        }

        .footer-copy {
            font-size: 11.5px;
            color: rgba(255, 255, 255, .35)
        }

        .footer-links {
            display: flex;
            gap: 22px
        }

        .footer-links a {
            font-size: 12.5px;
            color: rgba(255, 255, 255, .45);
            text-decoration: none;
            transition: .15s
        }

        .footer-links a:hover {
            color: #fff
        }

        /* ── CONVERTER PANEL ── */
        .converter-panel {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-top: 24px;
        }

        .conv-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .conv-header h3 {
            font-family: 'Sora', sans-serif;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .conv-header h3 svg {
            color: var(--teal);
        }

        .conv-cat-chips {
            display: flex;
            gap: 6px;
        }

        .conv-cat-chip {
            font-size: 11px;
            padding: 4px 12px;
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            color: var(--text2);
            background: var(--white);
            transition: .15s;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
        }

        .conv-cat-chip:hover {
            border-color: var(--teal);
            color: var(--teal);
        }

        .conv-cat-chip.active {
            border-color: var(--teal);
            background: var(--teal-lt);
            color: var(--teal);
        }

        .conv-body {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 12px;
            align-items: end;
        }

        .conv-col label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text3);
            display: block;
            margin-bottom: 5px;
            letter-spacing: .02em;
            text-transform: uppercase;
        }

        .conv-col input,
        .conv-col select {
            margin-bottom: 0;
        }

        .conv-swap-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 2px;
        }

        .conv-swap-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text2);
            transition: .2s;
        }

        .conv-swap-btn:hover {
            border-color: var(--teal);
            color: var(--teal);
            background: var(--teal-lt);
            transform: rotate(180deg);
        }

        .conv-result-card {
            margin-top: 16px;
            background: linear-gradient(135deg, #f0fdfa 0%, #ecfdf5 50%, #f0f9ff 100%);
            border: 1px solid #ccfbf1;
            border-radius: 10px;
            padding: 16px 18px;
            transition: .3s;
        }

        .conv-result-main {
            font-family: 'Sora', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
            display: flex;
            align-items: baseline;
            gap: 6px;
            flex-wrap: wrap;
        }

        .conv-result-main .conv-equals {
            color: var(--teal);
            font-size: 18px;
        }

        .conv-result-main .conv-result-val {
            color: var(--teal);
        }

        .conv-result-formula {
            font-size: 12px;
            color: var(--text3);
            margin-top: 6px;
            font-family: 'DM Sans', sans-serif;
        }

        .conv-result-error {
            color: #e11d48;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .conv-quick {
            margin-top: 18px;
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }

        .conv-quick-title {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--text3);
            margin-bottom: 8px;
        }

        .conv-quick-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .conv-quick-item {
            font-size: 12px;
            color: var(--text2);
            padding: 6px 10px;
            background: var(--bg);
            border-radius: 7px;
            cursor: pointer;
            transition: .15s;
            text-align: center;
            border: 1px solid transparent;
        }

        .conv-quick-item:hover {
            border-color: var(--teal);
            color: var(--teal);
            background: var(--teal-lt);
        }

        .conv-quick-item span {
            font-weight: 600;
            color: var(--text);
        }

        /* ══════════════════════════════════════════════
           RESPONSIVE BREAKPOINTS
           ══════════════════════════════════════════════ */

        /* ── Tablet (≤ 900px) ── */
        @media (max-width: 900px) {
            nav {
                padding: 0 24px;
            }

            main {
                padding: 28px 16px;
            }

            .top-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .panel {
                height: auto;
                position: static;
            }

            .viz-panel {
                min-height: 380px;
            }

            .comp-row {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            footer {
                padding: 28px 24px;
                flex-direction: column;
                gap: 14px;
                text-align: center;
            }

            .footer-links {
                justify-content: center;
                flex-wrap: wrap;
                gap: 14px;
            }
        }

        /* ── Mobile (≤ 600px) ── */
        @media (max-width: 600px) {
            nav {
                padding: 0 16px;
                height: 50px;
            }

            .nav-logo {
                font-size: 15px;
            }

            main {
                padding: 18px 10px;
            }

            .top-grid {
                gap: 14px;
                margin-bottom: 24px;
            }

            .panel {
                padding: 18px 16px;
                border-radius: 12px;
            }

            .panel h2 {
                font-size: 15px;
                margin-bottom: 14px;
            }

            .qty-row {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .gen-btn {
                padding: 10px;
                font-size: 12.5px;
                border-radius: 8px;
            }

            .c-chip {
                font-size: 10px;
                padding: 3px 8px;
            }

            .viz-panel {
                min-height: 320px;
                border-radius: 12px;
            }

            .viz-label {
                padding: 8px 12px;
                gap: 10px;
                border-radius: 8px;
                grid-template-columns: 1fr 1px 1fr;
            }

            .vlabel-tag {
                font-size: 7px;
            }

            .vlabel-val {
                font-size: 11px;
            }

            .comp-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .comp-card {
                padding: 10px 12px;
                border-radius: 8px;
            }

            .comp-card-val {
                font-size: 13px;
            }

            .tips-panel {
                padding: 14px 14px;
                border-radius: 10px;
                margin-bottom: 24px;
            }

            .tip-row {
                font-size: 12px;
            }

            .converter-panel {
                padding: 16px 14px;
                border-radius: 10px;
            }

            .conv-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .conv-body {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .conv-swap-wrap {
                justify-content: center;
            }

            .conv-swap-btn {
                transform: rotate(90deg);
            }

            .conv-swap-btn:hover {
                transform: rotate(270deg);
            }

            .conv-result-main {
                font-size: 16px;
            }

            .conv-result-formula {
                font-size: 11px;
            }

            .conv-quick-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            footer {
                margin-top: 40px;
                padding: 24px 16px;
            }

            .footer-logo {
                font-size: 14px;
            }

            .footer-copy {
                font-size: 10.5px;
            }

            .footer-links a {
                font-size: 11.5px;
            }

            .toast {
                font-size: 12px;
                padding: 8px 14px;
                border-radius: 7px;
            }
        }

        /* ── Very small phones (≤ 380px) ── */
        @media (max-width: 380px) {
            main {
                padding: 14px 6px;
            }

            .panel {
                padding: 14px 12px;
            }

            .qty-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .viz-label {
                grid-template-columns: 1fr;
                gap: 6px;
            }

            .vlabel-div {
                display: none;
            }

            .vlabel-section:last-child {
                text-align: left;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div style="display:flex;align-items:center"><span class="nav-logo">VisualMeasure</span></div>
    </nav>
    <main>
        <div class="top-grid">
            <div class="panel">
                <h2>Measurement Setup</h2>
                <div class="field">
                    <label class="label">Item</label>
                    <div class="input-wrap">
                        <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.35-4.35" />
                        </svg>
                        <input class="search-input" type="text" id="item-input"
                            placeholder="e.g., Milk, Rice, Water, Sugar…" />
                    </div>
                </div>
                <div class="qty-row">
                    <div>
                        <label class="label">Quantity</label>
                        <input type="number" id="qty-input" value="500" min="0.1" step="any" />
                    </div>
                    <div>
                        <label class="label">Unit</label>
                        <select id="unit-select">
                            <optgroup label="Volume">
                                <option value="ml" selected>ml</option>
                                <option value="l">litre (l)</option>
                                <option value="tsp">tsp (5ml)</option>
                                <option value="tbsp">tbsp (15ml)</option>
                                <option value="cup">cup (240ml)</option>
                                <option value="fl_oz">fl oz</option>
                            </optgroup>
                            <optgroup label="Weight">
                                <option value="g">g</option>
                                <option value="kg">kg</option>
                                <option value="oz">oz</option>
                                <option value="lb">lb</option>
                            </optgroup>
                        </select>
                    </div>
                </div>
                <div class="field container-chooser">
                    <label class="label">Container</label>
                    <div class="container-chips" id="container-chips"></div>
                </div>
                <button class="gen-btn" onclick="generate()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3" />
                    </svg>
                    Generate Visualization
                </button>
            </div>

            <div class="viz-panel" id="viz-panel">
                <canvas id="viz-canvas"></canvas>
                <div class="placeholder-state" id="placeholder">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 2h8l-1 7H9L8 2z" />
                        <path d="M9 9c0 5 3 8 3 8s3-3 3-8" />
                    </svg>
                    <p>Configure and click Generate</p>
                </div>
                <div class="viz-label" id="viz-label" style="display:none">
                    <div class="vlabel-section">
                        <div class="vlabel-tag">Measuring</div>
                        <div class="vlabel-val" id="vlabel-item">—</div>
                    </div>
                    <div class="vlabel-div"></div>
                    <div class="vlabel-section">
                        <div class="vlabel-tag">Container</div>
                        <div class="vlabel-val" id="vlabel-container">—</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="comp-row hidden" id="comp-row"></div>
        <div class="tips-panel hidden" id="tips-panel">
            <div class="tips-title">Measuring Tips</div>
            <div class="tips-list" id="tips-list"></div>
        </div>
        <div class="converter-panel">
            <div class="conv-header">
                <h3>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="17 1 21 5 17 9" />
                        <path d="M3 11V9a4 4 0 0 1 4-4h14" />
                        <polyline points="7 23 3 19 7 15" />
                        <path d="M21 13v2a4 4 0 0 1-4 4H3" />
                    </svg>
                    Unit Converter
                </h3>
                <div class="conv-cat-chips">
                    <button class="conv-cat-chip active" data-cat="weight"
                        onclick="setConvCategory('weight')">Weight</button>
                    <button class="conv-cat-chip" data-cat="volume" onclick="setConvCategory('volume')">Volume</button>
                </div>

            <div class="conv-body">

                    <label>From</label>
                    <input type="number" id="convert-value" value="1000" min="0" step="any">
                    <select id="from-unit" style="margin-top:8px">
                        <optgroup label="Weight">
                            <option value="g" selected>Grams (g)</option>
                            <option value="kg">Kilograms (kg)</option>
                            <option value="oz">Ounces (oz)</option>
                            <option value="lb">Pounds (lb)</option>
                        </optgroup>
                        <optgroup label="Volume">
                            <option value="ml">Millilitres (ml)</option>
                            <option value="l">Litres (l)</option>
                            <option value="tsp">Teaspoons (tsp)</option>
                            <option value="tbsp">Tablespoons (tbsp)</option>
                            <option value="cup">Cups (cup)</option>

                <div class="conv-swap-wrap">
                    <button class="conv-swap-btn" onclick="swapConvUnits()" title="Swap units">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4" />
                        </svg>
                    </button>
                </div>

                <div class="conv-col">
                    <label>To</label>
                    <input type="number" id="convert-result-value" readonly placeholder="—" tabindex="-1"
                        style="background:#f8fafc;cursor:default">
                    <select id="to-unit" style="margin-top:8px">
                        <optgroup label="Weight">
                            <option value="kg" selected>Kilograms (kg)</option>
                            <option value="g">Grams (g)</option>
                            <option value="oz">Ounces (oz)</option>
                            <option value="lb">Pounds (lb)</option>
                        </optgroup>
                        <optgroup label="Volume">
                            <option value="ml">Millilitres (ml)</option>
                            <option value="l">Litres (l)</option>
                            <option value="tsp">Teaspoons (tsp)</option>
                            <option value="tbsp">Tablespoons (tbsp)</option>
                            <option value="cup">Cups (cup)</option>
                            <option value="fl_oz">Fluid Ounces (fl oz)</option>
                        </optgroup>

            <div class="conv-result-card" id="conv-result-card"></div>

    </main>

    <footer>

        </div>
        <div class="footer-links">
            <!-- <a href="#">About</a><a href="#">Terms</a><a href="#">Privacy</a><a
                href="#">Support</a> -->
            <a class="footer-copy" href="https://github.com/akshi009">© Akshi Jain.</a>
        </div>
    </footer>
    <div class="toast" id="toast"></div>

    <script>
        /* ── Converter constants & logic ── */
        const CONV_UNITS = {
            weight: { g: 1, kg: 1000, oz: 28.3495, lb: 453.592 },
            volume: { ml: 1, l: 1000, tsp: 5, tbsp: 15, cup: 240, fl_oz: 29.5735 },
        };
        const UNIT_LABELS = { g: 'g', kg: 'kg', oz: 'oz', lb: 'lb', ml: 'ml', l: 'L', tsp: 'tsp', tbsp: 'tbsp', cup: 'cup', fl_oz: 'fl oz' };
        const UNIT_FULL = { g: 'Grams', kg: 'Kilograms', oz: 'Ounces', lb: 'Pounds', ml: 'Millilitres', l: 'Litres', tsp: 'Teaspoons', tbsp: 'Tablespoons', cup: 'Cups', fl_oz: 'Fluid Ounces' };

        function getUnitCategory(u) {
            if (CONV_UNITS.weight[u] !== undefined) return 'weight';
            if (CONV_UNITS.volume[u] !== undefined) return 'volume';
            return null;
        }

        const QUICK_REFS = {
            weight: [
                { from: 'g', to: 'kg', val: 1000 },
                { from: 'kg', to: 'lb', val: 1 },
                { from: 'oz', to: 'g', val: 1 },
                { from: 'lb', to: 'kg', val: 1 },
                { from: 'g', to: 'oz', val: 100 },
                { from: 'kg', to: 'g', val: 2.5 },
            ],
            volume: [
                { from: 'ml', to: 'l', val: 500 },
                { from: 'cup', to: 'ml', val: 1 },
                { from: 'tbsp', to: 'ml', val: 1 },
                { from: 'tsp', to: 'ml', val: 1 },
                { from: 'l', to: 'cup', val: 1 },
                { from: 'fl_oz', to: 'ml', val: 1 },
            ],
        };

        let convCategory = 'weight';

        function setConvCategory(cat) {
            convCategory = cat;
            document.querySelectorAll('.conv-cat-chip').forEach(c => {
                c.classList.toggle('active', c.dataset.cat === cat);
            });
            // Set default units for category
            const fromEl = document.getElementById('from-unit');
            const toEl = document.getElementById('to-unit');
            if (cat === 'weight') {
                fromEl.value = 'g'; toEl.value = 'kg';
            } else {
                fromEl.value = 'ml'; toEl.value = 'l';
            }
            convertUnits();
            renderQuickRefs();
        }

        function swapConvUnits() {
            const fromEl = document.getElementById('from-unit');
            const toEl = document.getElementById('to-unit');
            const resultValEl = document.getElementById('convert-result-value');
            const inputEl = document.getElementById('convert-value');
            const tmp = fromEl.value;
            fromEl.value = toEl.value;
            toEl.value = tmp;
            // Put result value into input
            if (resultValEl.value && !isNaN(parseFloat(resultValEl.value))) {
                inputEl.value = parseFloat(resultValEl.value);
            }
            convertUnits();
        }

        function smartFormat(n) {
            if (n === 0) return '0';
            if (Math.abs(n) >= 1000) return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
            if (Math.abs(n) >= 1) return parseFloat(n.toFixed(4)).toString();
            return parseFloat(n.toPrecision(4)).toString();
        }

        function convertUnits() {
            const value = parseFloat(document.getElementById('convert-value').value);
            const from = document.getElementById('from-unit').value;
            const to = document.getElementById('to-unit').value;
            const card = document.getElementById('conv-result-card');
            const resultValEl = document.getElementById('convert-result-value');

            const fromCat = getUnitCategory(from);
            const toCat = getUnitCategory(to);

            // Update category chips to match
            if (fromCat && fromCat === toCat && fromCat !== convCategory) {
                convCategory = fromCat;
                document.querySelectorAll('.conv-cat-chip').forEach(c => {
                    c.classList.toggle('active', c.dataset.cat === convCategory);
                });
                renderQuickRefs();
            }

            if (isNaN(value) || value < 0) {
                card.innerHTML = `<div class="conv-result-error">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>
                    Enter a valid number
                </div>`;
                resultValEl.value = '';
                return;
            }

            if (fromCat !== toCat) {
                card.innerHTML = `<div class="conv-result-error">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    Can't convert ${UNIT_FULL[from] || from} (${fromCat}) → ${UNIT_FULL[to] || to} (${toCat})
                </div>`;
                resultValEl.value = '';
                return;
            }

            const table = CONV_UNITS[fromCat];
            const base = value * table[from];
            const result = base / table[to];
            const factor = table[from] / table[to];

            resultValEl.value = smartFormat(result);

            card.innerHTML = `
                <div class="conv-result-main">
                    <span>${smartFormat(value)} ${UNIT_LABELS[from]}</span>
                    <span class="conv-equals">=</span>
                    <span class="conv-result-val">${smartFormat(result)} ${UNIT_LABELS[to]}</span>
                </div>
                <div class="conv-result-formula">1 ${UNIT_LABELS[from]} = ${smartFormat(factor)} ${UNIT_LABELS[to]}  ·  1 ${UNIT_LABELS[to]} = ${smartFormat(1 / factor)} ${UNIT_LABELS[from]}</div>
            `;
        }

        function renderQuickRefs() {
            const grid = document.getElementById('conv-quick-grid');
            const refs = QUICK_REFS[convCategory] || [];
            grid.innerHTML = refs.map(r => {
                const table = CONV_UNITS[getUnitCategory(r.from)];
                const result = (r.val * table[r.from]) / table[r.to];
                return `<div class="conv-quick-item" onclick="applyQuickRef('${r.from}','${r.to}',${r.val})">
                    <span>${smartFormat(r.val)} ${UNIT_LABELS[r.from]}</span> = ${smartFormat(result)} ${UNIT_LABELS[r.to]}
                </div>`;
            }).join('');
        }

        function applyQuickRef(from, to, val) {
            document.getElementById('from-unit').value = from;
            document.getElementById('to-unit').value = to;
            document.getElementById('convert-value').value = val;
            convertUnits();
        }

        document.querySelectorAll('#convert-value,#from-unit,#to-unit')
            .forEach(el => el.addEventListener('input', convertUnits));

        convertUnits();
        renderQuickRefs();
        const CONTAINERS = {
            teaspoon: { label: 'Teaspoon', capacity: 5, unit: 'ml', shape: 'spoon' },
            tablespoon: { label: 'Tablespoon', capacity: 15, unit: 'ml', shape: 'spoon' },
            shotglass: { label: 'Shot Glass', capacity: 60, unit: 'ml', shape: 'shot' },
            measuringcup: { label: 'Measuring Cup', capacity: 250, unit: 'ml', shape: 'mcup' },
            glass: { label: 'Glass', capacity: 350, unit: 'ml', shape: 'glass' },
            largeglass: { label: 'Large Glass', capacity: 600, unit: 'ml', shape: 'glass' },
            mug: { label: 'Mug', capacity: 350, unit: 'ml', shape: 'mug' },
            bowl: { label: 'Bowl', capacity: 600, unit: 'ml', shape: 'bowl' },
            largebowl: { label: 'Large Bowl', capacity: 1500, unit: 'ml', shape: 'bowl' },
            bottle: { label: 'Bottle', capacity: 1000, unit: 'ml', shape: 'bottle' },
            plate: { label: 'Plate', capacity: 500, unit: 'g', shape: 'plate' },
            smallplate: { label: 'Small Plate', capacity: 200, unit: 'g', shape: 'plate' },
        };
        const INGREDIENTS = {
            water: { type: 'liquid', color: '#87ceeb', rgb: [135, 206, 235], opacity: .82, containers: ['teaspoon', 'tablespoon', 'measuringcup', 'glass', 'largeglass', 'bottle'], defaultContainer: 'glass', conversions: { perCup: 240, perTbsp: 15 } },
            milk: { type: 'liquid', color: '#f5f0e0', rgb: [245, 240, 224], opacity: .92, containers: ['teaspoon', 'tablespoon', 'measuringcup', 'glass', 'largeglass', 'bottle'], defaultContainer: 'glass', conversions: { perCup: 240, perTbsp: 15 } },
            oil: { type: 'liquid', color: '#d4a017', rgb: [212, 160, 23], opacity: .88, containers: ['teaspoon', 'tablespoon', 'measuringcup', 'glass'], defaultContainer: 'tablespoon', conversions: { perTbsp: 14 } },
            juice: { type: 'liquid', color: '#ff8c00', rgb: [255, 140, 0], opacity: .88, containers: ['measuringcup', 'glass', 'largeglass', 'bottle'], defaultContainer: 'glass', conversions: { perCup: 240 } },
            coffee: { type: 'liquid', color: '#6b3a2a', rgb: [107, 58, 42], opacity: .94, containers: ['measuringcup', 'glass', 'mug'], defaultContainer: 'mug', conversions: { perCup: 240 } },
            tea: { type: 'liquid', color: '#b5651d', rgb: [181, 101, 29], opacity: .88, containers: ['measuringcup', 'glass', 'mug'], defaultContainer: 'mug', conversions: { perCup: 240 } },
            rice: { type: 'solid', color: '#f5f0d0', rgb: [245, 240, 208], opacity: 1, containers: ['measuringcup', 'bowl', 'plate'], defaultContainer: 'measuringcup', conversions: { perCup: 185, perTbsp: 12 } },
            flour: { type: 'solid', color: '#faf6ee', rgb: [250, 246, 238], opacity: 1, containers: ['measuringcup', 'bowl', 'plate'], defaultContainer: 'measuringcup', conversions: { perCup: 125, perTbsp: 8 } },
            sugar: { type: 'solid', color: '#fffef0', rgb: [255, 254, 240], opacity: 1, containers: ['teaspoon', 'tablespoon', 'measuringcup', 'bowl'], defaultContainer: 'measuringcup', conversions: { perCup: 200, perTbsp: 12, perTsp: 4 } },
            salt: { type: 'solid', color: '#eef0f8', rgb: [238, 240, 248], opacity: 1, containers: ['teaspoon', 'tablespoon', 'measuringcup'], defaultContainer: 'teaspoon', conversions: { perTsp: 6, perTbsp: 18 } },
            paneer: { type: 'solid', color: '#fffde0', rgb: [255, 253, 224], opacity: 1, containers: ['smallplate', 'plate', 'bowl'], defaultContainer: 'plate', conversions: { perCube: 30 } },
            butter: { type: 'solid', color: '#fad16a', rgb: [250, 209, 106], opacity: 1, containers: ['teaspoon', 'tablespoon', 'smallplate'], defaultContainer: 'tablespoon', conversions: { perTbsp: 14, perTsp: 4.7 } },
            almonds: { type: 'solid', color: '#c8956c', rgb: [200, 149, 108], opacity: 1, containers: ['smallplate', 'plate', 'bowl'], defaultContainer: 'smallplate', conversions: { perHandful: 30 } },
            oats: { type: 'solid', color: '#d4b896', rgb: [212, 184, 150], opacity: 1, containers: ['measuringcup', 'bowl'], defaultContainer: 'measuringcup', conversions: { perCup: 90 } },
            default: { type: 'liquid', color: '#88aacc', rgb: [136, 170, 204], opacity: .82, containers: ['teaspoon', 'tablespoon', 'measuringcup', 'glass', 'bowl', 'plate'], defaultContainer: 'glass', conversions: {} },
        };
        const TO_ML = { ml: 1, l: 1000, tsp: 5, tbsp: 15, cup: 240, fl_oz: 29.5735 };
        const TO_G = { g: 1, kg: 1000, oz: 28.3495, lb: 453.592 };

        function normalizeAmount(qty, unit) {
            if (TO_ML[unit]) return { val: qty * TO_ML[unit], baseUnit: 'ml' };
            if (TO_G[unit]) return { val: qty * TO_G[unit], baseUnit: 'g' };
            return { val: qty, baseUnit: unit };
        }
        function matchIngredient(name) {
            const n = name.toLowerCase().trim();
            const aliases = {
                water: ['water', 'pani', 'h2o'], milk: ['milk', 'doodh', 'almond milk', 'oat milk'],
                oil: ['oil', 'tel', 'olive oil', 'sunflower oil', 'coconut oil', 'mustard oil', 'ghee'],
                juice: ['juice', 'nimbu pani'], coffee: ['coffee', 'espresso', 'cappuccino'],
                tea: ['tea', 'chai'], rice: ['rice', 'chawal', 'basmati'],
                flour: ['flour', 'atta', 'maida', 'wheat'], sugar: ['sugar', 'cheeni', 'shakkar'],
                salt: ['salt', 'namak'], paneer: ['paneer', 'cottage cheese', 'chenna'],
                butter: ['butter', 'makhan'], almonds: ['almond', 'badam'], oats: ['oat', 'oats', 'porridge'],
            };
            for (const [key, list] of Object.entries(aliases)) {
                if (list.some(a => n.includes(a) || a.includes(n))) return key;
            }
            return 'default';
        }
        function autoSelectContainer(ingKey, normalized) {
            const ing = INGREDIENTS[ingKey] || INGREDIENTS.default;

            for (const ck of ing.containers) {
                const cap = CONTAINERS[ck].capacity;

                if (normalized.val <= cap * 1.05) {
                    return ck;
                }
            }

            return ing.containers[ing.containers.length - 1];
        }

        // ══════════════════════════════════════════════════════
        // STATE
        // ══════════════════════════════════════════════════════
        let state = { item: 'Milk', qty: 500, unit: 'ml', ingKey: 'milk', containerKey: 'glass', fillPct: 0, hasResult: false };

        // ══════════════════════════════════════════════════════
        // CANVAS 2D RENDERER
        // ══════════════════════════════════════════════════════
        const cvs = document.getElementById('viz-canvas');
        const ctx = cvs.getContext('2d');
        let animFill = 0, targetFill = 0, animRAF = null, isAnimating = false;
        let waveOffset = 0;
        let pourParticles = [];
        let streamActive = false, streamY = 0, streamTargetY = 0, streamTimer = 0;

        let resizeTimer;
        function resizeCanvas() {
            const panel = document.getElementById('viz-panel');
            const w = panel.clientWidth;
            const h = panel.clientHeight;
            cvs.width = w * devicePixelRatio;
            cvs.height = 1000;
            cvs.style.width = w + 'px';
            cvs.style.height = h + 'px';
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(devicePixelRatio, devicePixelRatio);
            if (state.hasResult) drawFrame();
        }
        function debouncedResize() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(resizeCanvas, 80);
        }
        window.addEventListener('resize', debouncedResize);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 150));

        // ── Container shape geometry (returns path drawing function) ──
        // All shapes are drawn in a normalised box: cx=centrex, top=containerTop, w=containerWidth, h=containerHeight
        // Returns {drawOuter, drawInner, getInnerX(normalised_y_0to1)→{left,right} }
        function getShapeGeom(shape, cx, top, cw, ch) {
            const b = top + ch; // bottom y
            const t = top;    // top y
            switch (shape) {
                case 'glass': case 'shot': {
                    // Trapezoid: narrower at bottom, wider at top
                    const bw = cw * 0.62, tw = cw; // bottom width, top width
                    const bx0 = cx - bw / 2, bx1 = cx + bw / 2, tx0 = cx - tw / 2, tx1 = cx + tw / 2;
                    return {
                        drawOuter: (ctx) => { ctx.beginPath(); ctx.moveTo(tx0, t); ctx.lineTo(tx1, t); ctx.lineTo(bx1, b); ctx.lineTo(bx0, b); ctx.closePath(); },
                        getInnerX: (fy) => {// fy=0 at bottom,1 at top
                            const lx = bx0 + (tx0 - bx0) * fy, rx = bx1 + (tx1 - bx1) * fy;
                            return { left: lx + 3, right: rx - 3 };
                        },
                        bottomY: b, topY: t,
                    };
                }
                case 'mug': {
                    const mw = cw * 0.88;
                    const mx0 = cx - mw / 2, mx1 = cx + mw / 2;
                    return {
                        drawOuter: (ctx) => {
                            ctx.beginPath(); ctx.moveTo(mx0, t); ctx.lineTo(mx1, t); ctx.lineTo(mx1, b); ctx.lineTo(mx0, b); ctx.closePath();
                            // handle
                            ctx.moveTo(mx1, t + ch * 0.2); ctx.bezierCurveTo(mx1 + cw * 0.35, t + ch * 0.2, mx1 + cw * 0.35, t + ch * 0.65, mx1, t + ch * 0.65);
                        },
                        getInnerX: (fy) => ({ left: mx0 + 3, right: mx1 - 3 }),
                        bottomY: b, topY: t,
                    };
                }
                case 'bowl': {
                    // Elliptical cross-section bowl
                    const bw = cw, tw = cw * 0.7;
                    return {
                        drawOuter: (ctx) => {
                            ctx.beginPath();
                            // left side arc
                            ctx.moveTo(cx - tw / 2, t);
                            ctx.bezierCurveTo(cx - bw / 2, t + ch * 0.2, cx - bw / 2, t + ch * 0.85, cx - bw * 0.15, b);
                            ctx.lineTo(cx + bw * 0.15, b);
                            ctx.bezierCurveTo(cx + bw / 2, t + ch * 0.85, cx + bw / 2, t + ch * 0.2, cx + tw / 2, t);
                            ctx.closePath();
                        },
                        getInnerX: (fy) => {
                            // fy=0 bottom,1 top
                            const halfW = (tw / 2) * fy + (bw * 0.12) * (1 - fy) + ((bw / 2 - bw * 0.12) * Math.sin(fy * Math.PI * 0.7));
                            return { left: cx - halfW + 3, right: cx + halfW - 3 };
                        },
                        bottomY: b, topY: t,
                    };
                }
                case 'bottle': {
                    const neckW = cw * 0.28, bodyW = cw * 0.85;
                    const neckH = ch * 0.3;
                    return {
                        drawOuter: (ctx) => {
                            ctx.beginPath();
                            ctx.moveTo(cx - neckW / 2, t);
                            ctx.lineTo(cx + neckW / 2, t);
                            ctx.bezierCurveTo(cx + neckW / 2, t + neckH, cx + bodyW / 2, t + neckH * 1.4, cx + bodyW / 2, t + neckH * 1.8);
                            ctx.lineTo(cx + bodyW / 2, b);
                            ctx.lineTo(cx - bodyW / 2, b);
                            ctx.lineTo(cx - bodyW / 2, t + neckH * 1.8);
                            ctx.bezierCurveTo(cx - bodyW / 2, t + neckH * 1.4, cx - neckW / 2, t + neckH, cx - neckW / 2, t);
                            ctx.closePath();
                        },
                        getInnerX: (fy) => {
                            // fy=0 bottom,1 top
                            const bodyFill = Math.min(fy / 0.7, 1); // body portion
                            const neckFill = Math.max((fy - 0.7) / 0.3, 0);
                            const hw = bodyW / 2 * (1 - neckFill) + neckW / 2 * neckFill;
                            return { left: cx - hw + 3, right: cx + hw - 3 };
                        },
                        bottomY: b, topY: t,
                    };
                }
                case 'mcup': {
                    // Measuring cup: slight taper
                    const bw = cw * 0.7, tw = cw * 0.85;
                    const bx0 = cx - bw / 2, bx1 = cx + bw / 2, tx0 = cx - tw / 2, tx1 = cx + tw / 2;
                    // spout
                    return {
                        drawOuter: (ctx) => {
                            ctx.beginPath(); ctx.moveTo(tx0, t); ctx.lineTo(tx1, t);
                            // small spout
                            ctx.lineTo(tx1 + cw * 0.1, t - ch * 0.06); ctx.lineTo(tx1 + cw * 0.1, t);
                            ctx.lineTo(bx1, b); ctx.lineTo(bx0, b); ctx.closePath();
                        },
                        getInnerX: (fy) => {
                            const lx = bx0 + (tx0 - bx0) * fy, rx = bx1 + (tx1 - bx1) * fy;
                            return { left: lx + 3, right: rx - 3 };
                        },
                        bottomY: b, topY: t,
                    };
                }
                case 'plate': {
                    const pw = cw, ph = ch;
                    return {
                        drawOuter: (ctx) => {
                            ctx.beginPath();
                            ctx.ellipse(cx, b, pw / 2, ph * 0.18, 0, Math.PI, 0);
                            ctx.lineTo(cx + pw / 2, b);
                            ctx.closePath();
                        },
                        getInnerX: (fy) => ({ left: cx - pw * 0.42 + 3, right: cx + pw * 0.42 - 3 }),
                        bottomY: b, topY: b - ph * 0.18,
                    };
                }
                case 'spoon': {
                    const sw = cw * 0.65;
                    return {
                        drawOuter: (ctx) => {
                            ctx.beginPath();
                            ctx.ellipse(cx, b - ch * 0.3, sw / 2, ch * 0.35, 0, 0, Math.PI * 2);
                        },
                        getInnerX: (fy) => {
                            const r = sw / 2 * (1 - Math.pow(fy - 0.5, 2) * 1.5);
                            return { left: cx - r + 2, right: cx + r - 2 };
                        },
                        bottomY: b - ch * 0.3 + ch * 0.32, topY: b - ch * 0.3 - ch * 0.32,
                    };
                }
                default: return getShapeGeom('glass', cx, top, cw, ch);
            }
        }

        // ── Main draw function ──
        function drawFrame() {
            if (!state.hasResult) return;
            const W = cvs.width / devicePixelRatio;
            const H = cvs.height / devicePixelRatio;
            ctx.clearRect(0, 0, W, H);

            const ing = INGREDIENTS[state.ingKey] || INGREDIENTS.default;
            const cont = CONTAINERS[state.containerKey];
            const [r, g, b] = ing.rgb;

            // Container layout – responsive padding
            const padX = W < 300 ? 40 : W < 500 ? 60 : 90;
            const padTop = W < 300 ? 30 : 50;
            const padBot = W < 300 ? 40 : 70;
            const cw = Math.min(W - padX * 2, 260);
            const ch = H - padTop - padBot;
            const cx = W / 2;
            const top = padTop;

            const geom = getShapeGeom(cont.shape, cx, top, cw, ch);

            // ── Draw measurement tick marks on the right side ──
            const tickCount = 5;
            ctx.save();
            ctx.font = `500 11px 'DM Sans',sans-serif`;
            ctx.textAlign = 'left';
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tickCount; i++) {
                const fy = i / tickCount; // 0=bottom,1=top
                const pctLabel = Math.round(fy * 100);
                const capLabel = Math.round(fy * cont.capacity) + (cont.unit === 'ml' ? 'ml' : 'g');
                // y position: fy=0→geom.bottomY, fy=1→geom.topY
                const ypos = geom.bottomY + (geom.topY - geom.bottomY) * fy;
                const innerX = geom.getInnerX(fy);
                // tick line
                ctx.beginPath();
                ctx.moveTo(innerX.right + 2, ypos);
                ctx.lineTo(innerX.right + 14, ypos);
                ctx.stroke();
                ctx.fillText(capLabel, innerX.right + 17, ypos + 4);
            }
            // current fill line + label
            if (animFill > 0.01) {
                const fillFy = Math.min(animFill, 0.97);
                const fillYpos = geom.bottomY + (geom.topY - geom.bottomY) * fillFy;
                const fillInner = geom.getInnerX(fillFy);
                ctx.strokeStyle = `rgba(${r},${g},${b},0.9)`;
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 3]);
                ctx.beginPath();
                ctx.moveTo(fillInner.left - 20, fillYpos);
                ctx.lineTo(fillInner.right + 20, fillYpos);
                ctx.stroke();
                ctx.setLineDash([]);
                // fill label on left
                ctx.fillStyle = `rgba(${r},${g},${b},1)`;
                ctx.font = `700 13px 'Sora',sans-serif`;
                ctx.textAlign = 'right';
                const pctNow = Math.round(animFill * 100);
                const capNow = Math.round(animFill * cont.capacity) + (cont.unit === 'ml' ? 'ml' : 'g');
                ctx.fillText(`${capNow} · ${pctNow}%`, fillInner.left - 24, fillYpos + 4);
            }
            ctx.restore();

            // ── Clip region = container interior ──
            ctx.save();
            geom.drawOuter(ctx);
            ctx.clip();

            // Background inside container (dark tinted)
            ctx.fillStyle = 'rgba(15,25,45,0.92)';
            ctx.fillRect(0, 0, W, H);

            // ── Liquid fill ──
            if (animFill > 0.005) {
                const fillFy = Math.min(animFill, 0.97);
                const fillYpos = geom.bottomY + (geom.topY - geom.bottomY) * fillFy;
                const isLiquid = ing.type === 'liquid';

                if (isLiquid) {
                    // Main liquid body
                    const grad = ctx.createLinearGradient(cx - cw / 2, fillYpos, cx + cw / 2, fillYpos);
                    grad.addColorStop(0, `rgba(${r},${g},${b},${ing.opacity * 0.7})`);
                    grad.addColorStop(0.4, `rgba(${r},${g},${b},${ing.opacity})`);
                    grad.addColorStop(1, `rgba(${r},${g},${b},${ing.opacity * 0.85})`);
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, fillYpos, W, H);

                    // Wave on top surface
                    ctx.beginPath();
                    ctx.moveTo(0, fillYpos);
                    const waveAmp = isAnimating ? 1.5 : 3;
                    for (let x = 0; x <= W; x += 4) {
                        const wy = fillYpos + Math.sin((x * 0.035) + waveOffset) * waveAmp + Math.sin((x * 0.06) + waveOffset * 1.3) * waveAmp * 0.4;
                        ctx.lineTo(x, wy);
                    }
                    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
                    const waveGrad = ctx.createLinearGradient(0, fillYpos - 10, 0, fillYpos + 20);
                    waveGrad.addColorStop(0, `rgba(${Math.min(r + 40, 255)},${Math.min(g + 40, 255)},${Math.min(b + 40, 255)},0.7)`);
                    waveGrad.addColorStop(1, `rgba(${r},${g},${b},${ing.opacity})`);
                    ctx.fillStyle = waveGrad;
                    ctx.fill();

                    // Specular sheen
                    const sheen = ctx.createLinearGradient(cx - cw * 0.4, fillYpos, cx - cw * 0.1, geom.bottomY);
                    sheen.addColorStop(0, 'rgba(255,255,255,0.12)');
                    sheen.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = sheen;
                    ctx.fillRect(0, fillYpos, W, H);
                } else {
                    // Solid: flat fill with texture dots
                    const baseColor = `rgba(${r},${g},${b},0.95)`;
                    ctx.fillStyle = baseColor;
                    ctx.fillRect(0, fillYpos, W, H);
                    // grain texture
                    ctx.fillStyle = `rgba(${Math.max(r - 30, 0)},${Math.max(g - 30, 0)},${Math.max(b - 30, 0)},0.4)`;
                    const seed = 42;
                    for (let i = 0; i < 180; i++) {
                        const gx = cx - cw / 2 + ((i * 73 + seed) % cw);
                        const gy = fillYpos + ((i * 47 + seed) % (geom.bottomY - fillYpos + 1));
                        const gs = 1 + ((i * 31) % 3) * 0.7;
                        ctx.beginPath(); ctx.arc(gx, gy, gs, 0, Math.PI * 2); ctx.fill();
                    }
                    // top surface line
                    ctx.fillStyle = `rgba(${Math.min(r + 50, 255)},${Math.min(g + 50, 255)},${Math.min(b + 50, 255)},0.6)`;
                    ctx.fillRect(0, fillYpos, W, 4);
                }
            }

            // ── Pour particles (inside clip) ──
            for (const p of pourParticles) {
                ctx.globalAlpha = p.alpha;
                if (ing.type === 'liquid') {
                    ctx.fillStyle = `rgba(${r},${g},${b},0.9)`;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
                } else {
                    ctx.fillStyle = `rgba(${r},${g},${b},0.95)`;
                    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                    ctx.fillRect(-p.r * 1.5, -p.r * 0.6, p.r * 3, p.r * 1.2);
                    ctx.restore();
                }
                ctx.globalAlpha = 1;
            }

            // ── Pour stream (inside clip) ──
            if (streamActive) {
                const sw = ing.type === 'liquid' ? 6 : 8;
                if (ing.type === 'liquid') {
                    const sg = ctx.createLinearGradient(cx, top - 30, cx, streamY);
                    sg.addColorStop(0, `rgba(${r},${g},${b},0)`);
                    sg.addColorStop(0.4, `rgba(${r},${g},${b},0.7)`);
                    sg.addColorStop(1, `rgba(${r},${g},${b},0.5)`);
                    ctx.fillStyle = sg;
                    ctx.fillRect(cx - sw / 2, top - 30, sw, streamY - (top - 30));
                } else {
                    // grain stream: dots
                    ctx.fillStyle = `rgba(${r},${g},${b},0.85)`;
                    for (let sy = top; sy < streamY; sy += 8) {
                        const ox = (Math.sin(sy * 0.3 + streamTimer) * sw);
                        ctx.beginPath(); ctx.arc(cx + ox, sy, 2.5, 0, Math.PI * 2); ctx.fill();
                    }
                }
            }

            ctx.restore(); // end clip

            // ── Container outline (drawn on top) ──
            ctx.save();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = 'rgba(180,210,230,0.55)';
            geom.drawOuter(ctx);
            ctx.stroke();
            // rim highlight top
            ctx.strokeStyle = 'rgba(220,240,255,0.35)';
            ctx.lineWidth = 1;
            geom.drawOuter(ctx);
            ctx.stroke();
            ctx.restore();

            // ── Container label top ──
            // ctx.save();
            // ctx.font = `600 13px 'Sora',sans-serif`;
            // ctx.fillStyle = 'rgba(255,255,255,0.55)';
            // ctx.textAlign = 'center';
            // ctx.fillText(cont.icon + ' ' + cont.label + ' (' + cont.capacity + (cont.unit === 'ml' ? 'ml' : 'g') + ')', cx, top - 16);
            // ctx.restore();
        }

        // ── Animation loop ──
        let lastT = 0;
        function loop(t) {
            requestAnimationFrame(loop);
            const dt = Math.min(t - lastT, 50); lastT = t;
            waveOffset += dt * 0.002;
            streamTimer += dt * 0.01;

            // Update particles
            pourParticles = pourParticles.filter(p => {
                p.y += p.vy; p.vy += 0.4; p.x += p.vx; p.alpha -= dt * 0.0014;
                p.rot += p.rotV;
                return p.alpha > 0 && p.y < (cvs.height / devicePixelRatio + 20);
            });

            if (state.hasResult) drawFrame();
        }
        requestAnimationFrame(loop);

        // ── Fill animation ──
        function startFillAnim(target) {
            if (animRAF) cancelAnimationFrame(animRAF);
            isAnimating = true;
            animFill = 0;
            const DURATION = 1800;
            const startT = performance.now();
            const cont = CONTAINERS[state.containerKey];
            const geomBot = getShapeGeom(cont.shape, 0, 0, 1, 1).bottomY; // normalised, unused
            // calculate pixel bottomY for stream targeting
            const panel = document.getElementById('viz-panel');
            const W = panel.clientWidth, H = panel.clientHeight;
            const padX = W < 300 ? 40 : W < 500 ? 60 : 90;
            const padTop = W < 300 ? 30 : 50;
            const padBot = W < 300 ? 40 : 70;
            const ch = H - padTop - padBot;
            const geomFull = getShapeGeom(cont.shape, W / 2, padTop, Math.min(W - padX * 2, 260), ch);

            // Spawn particles + stream
            spawnPour(target, geomFull, W, H);

            function step(now) {
                const p = Math.min((now - startT) / DURATION, 1);
                const ease = 1 - Math.pow(1 - p, 3);
                animFill = ease * target;
                // update stream target
                const fy = Math.min(animFill, 0.97);
                streamY = geomFull.bottomY + (geomFull.topY - geomFull.bottomY) * fy;
                // update fill bar
                const pct = Math.min(animFill * 100, 100);
                document.getElementById('fill-bar') && (document.getElementById('fill-bar').style.height = pct + '%');
                if (p < 1) {
                    animRAF = requestAnimationFrame(step);
                } else {
                    animFill = target; isAnimating = false;
                    streamActive = false;
                    setTimeout(() => { pourParticles = []; }, 600);
                }
            }
            animRAF = requestAnimationFrame(step);
        }

        function spawnPour(fillTarget, geomFull, W, H) {
            const ing = INGREDIENTS[state.ingKey] || INGREDIENTS.default;
            streamActive = true;
            streamY = geomFull.topY; // start at top, will animate down as fill rises
            const count = ing.type === 'liquid' ? 35 : 55;
            const cx = W / 2;
            for (let i = 0; i < count; i++) {
                const delay = i / count * 1400;
                setTimeout(() => {
                    if (!isAnimating && i > 5) return;
                    pourParticles.push({
                        x: cx + (Math.random() - 0.5) * 14,
                        y: geomFull.topY - 20,
                        vx: (Math.random() - 0.5) * 2.5,
                        vy: Math.random() * 3 + 1,
                        r: ing.type === 'liquid' ? 2 + Math.random() * 4 : 2.5 + Math.random() * 3,
                        alpha: 0.9 + Math.random() * 0.1,
                        rot: Math.random() * Math.PI * 2,
                        rotV: (Math.random() - 0.5) * 0.2,
                    });
                }, delay);
            }
            // Kill stream after fill animation
            setTimeout(() => { streamActive = false; }, 1900);
        }

        // ══════════════════════════════════════════════════════
        // UI
        // ══════════════════════════════════════════════════════
        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

        function populateContainerChips(ingKey, normalized) {
            const ing = INGREDIENTS[ingKey] || INGREDIENTS.default;
            const wrap = document.getElementById('container-chips');

            wrap.innerHTML = '';

            ing.containers.forEach(ck => {
                const c = CONTAINERS[ck];

                let displayCapacity = c.capacity;
                let displayUnit = normalized.baseUnit;

                if (normalized.baseUnit === 'g') {
                    displayCapacity = Math.round(c.capacity);
                    displayUnit = 'g';
                } else {
                    displayCapacity = Math.round(c.capacity);
                    displayUnit = 'ml';
                }

                const chip = document.createElement('button');
                chip.className =
                    'c-chip' + (ck === state.containerKey ? ' active' : '');

                chip.textContent =
                    `${c.label} (${displayCapacity}${displayUnit})`;

                chip.onclick = () => {
                    state.containerKey = ck;

                    document
                        .querySelectorAll('.c-chip')
                        .forEach(ch => ch.classList.remove('active'));

                    chip.classList.add('active');

                    if (state.hasResult) generate(true);
                };

                wrap.appendChild(chip);
            });
        }

        function generate(skipAutoContainer = false) {
            const item = document.getElementById('item-input').value.trim();
            const qty = parseFloat(document.getElementById('qty-input').value);
            const unit = document.getElementById('unit-select').value;
            if (!item) { showToast('Please enter an item name'); return; }
            if (!qty || qty <= 0) { showToast('Enter a valid quantity'); return; }
            const ingKey = matchIngredient(item);
            const normalized = normalizeAmount(qty, unit);
            if (!skipAutoContainer) state.containerKey = autoSelectContainer(ingKey, normalized);
            state.item = item; state.qty = qty; state.unit = unit; state.ingKey = ingKey;
            const cont = CONTAINERS[state.containerKey];
            const fillPct = Math.min(normalized.val / cont.capacity, 1.0);
            state.fillPct = fillPct;
            state.hasResult = true;
            populateContainerChips(ingKey, normalized);
            document.getElementById('placeholder').style.display = 'none';
            const unitLabels = { ml: 'ml', l: 'L', tsp: 'tsp', tbsp: 'tbsp', cup: 'cup', fl_oz: 'fl oz', g: 'g', kg: 'kg', oz: 'oz', lb: 'lb' };
            document.getElementById('vlabel-item').textContent = qty + ' ' + (unitLabels[unit] || unit) + ' ' + capitalize(item);
            document.getElementById('vlabel-container').textContent = cont.label + ' (' + cont.capacity + (cont.unit === 'ml' ? 'ml' : 'g') + ')';
            document.getElementById('viz-label').style.display = 'grid';
            resizeCanvas();
            startFillAnim(fillPct);
            renderComparisons(ingKey, normalized, qty, unit);
            renderTips(ingKey, normalized, qty, unit, state.containerKey, fillPct);
        }

        function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
        function fmt(n, dec = 1) { const r = parseFloat(n.toFixed(dec)); return Number.isInteger(r) ? String(r) : String(r); }

        function renderComparisons(ingKey, normalized, qty, unit) {
            const row = document.getElementById('comp-row');
            row.classList.remove('hidden');
            const { val, baseUnit } = normalized;
            const ing = INGREDIENTS[ingKey] || INGREDIENTS.default;
            const cards = [];

            // Cups equivalent
            if (ing.conversions.perCup) {
                const cups = val / ing.conversions.perCup;
                cards.push({ label: 'Cups', val: fmt(cups, 2), sub: `1 cup ≈ ${ing.conversions.perCup}${baseUnit}` });
            }

            // Tablespoons
            if (ing.conversions.perTbsp) {
                const tbsp = val / ing.conversions.perTbsp;
                cards.push({ label: 'Tablespoons', val: fmt(tbsp, 1), sub: `1 tbsp ≈ ${ing.conversions.perTbsp}${baseUnit}` });
            }

            // Teaspoons
            if (ing.conversions.perTsp) {
                const tsp = val / ing.conversions.perTsp;
                cards.push({ label: 'Teaspoons', val: fmt(tsp, 1), sub: `1 tsp ≈ ${ing.conversions.perTsp}${baseUnit}` });
            }

            // Weight/volume conversion
            if (baseUnit === 'ml') {
                cards.push({ label: 'Litres', val: fmt(val / 1000, 3), sub: `${fmt(val, 0)} ml` });
            } else if (baseUnit === 'g') {
                cards.push({ label: 'Kilograms', val: fmt(val / 1000, 3), sub: `${fmt(val, 0)} g` });
            }

            // Handfuls
            if (ing.conversions.perHandful) {
                const handfuls = val / ing.conversions.perHandful;
                cards.push({ label: 'Handfuls', val: fmt(handfuls, 1), sub: `1 handful ≈ ${ing.conversions.perHandful}g` });
            }

            // Cubes (e.g. paneer)
            if (ing.conversions.perCube) {
                const cubes = val / ing.conversions.perCube;
                cards.push({ label: 'Cubes (≈1″)', val: fmt(cubes, 1), sub: `1 cube ≈ ${ing.conversions.perCube}g` });
            }

            // Limit to 4 cards
            const display = cards.slice(0, 4);
            row.innerHTML = display.map(c => `
                <div class="comp-card">
                    <div class="comp-card-label">${c.label}</div>
                    <div class="comp-card-val">${c.val}</div>
                    <div class="comp-card-sub">${c.sub}</div>
                </div>
            `).join('');
        }


        function renderTips(ingKey, normalized, qty, unit, containerKey, fillPct) {
            const panel = document.getElementById('tips-panel'), list = document.getElementById('tips-list');
            panel.classList.remove('hidden');
            const { val, baseUnit } = normalized;
            const cont = CONTAINERS[containerKey];
            const tips = [];
            if (fillPct >= 1) {
                tips.push(`⚠️ ${fmt(val, 0)}${baseUnit} fills the ${cont.label} to the brim (${cont.capacity}${cont.unit}). Consider a larger container.`);
            } else {
                tips.push(`Fill the ${cont.label} to ${Math.round(fillPct * 100)}% — the dashed line shows the exact level.`);
            }
            if (baseUnit === 'ml') {
                if (val <= 5) tips.push('A single teaspoon holds exactly 5 ml.');
                else if (val <= 15) tips.push('A tablespoon holds 15 ml — fill it ' + fmt(val / 15 * 100, 0) + '%.');
                else if (val <= 250) tips.push('Fill to the ' + Math.round(val) + ' ml mark on a measuring cup.');
                else tips.push('Use a measuring jug with ml markings for accuracy.');
            } else if (baseUnit === 'g') {
                tips.push('A kitchen scale is most accurate for ' + val + 'g.');
                const ing = INGREDIENTS[ingKey];
                if (ing && ing.conversions.perTbsp) tips.push('Approx ' + fmt(val / ing.conversions.perTbsp) + ' level tablespoon(s) ≈ ' + fmt(val, 0) + 'g.');
                if (ing && ing.conversions.perCup) tips.push('1 cup ≈ ' + ing.conversions.perCup + 'g — you need ' + fmt(val / ing.conversions.perCup, 2) + ' cup(s).');
            }
            list.innerHTML = tips.map(t => `<div class="tip-row"><div class="tip-dot"></div><span>${t}</span></div>`).join('');
        }

        // ── Init ──
        ['item-input', 'qty-input'].forEach(id => {
            document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });
        });
        populateContainerChips('milk', { val: 500, baseUnit: 'ml' });
        document.getElementById('item-input').value = 'Milk';
        document.getElementById('qty-input').value = '500';
        document.getElementById('unit-select').value = 'ml';
        resizeCanvas();
        generate();
    </script>
</body>
